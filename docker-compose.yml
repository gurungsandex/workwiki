services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workwiki
      POSTGRES_PASSWORD: workwiki
      POSTGRES_DB: workwiki
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workwiki -d workwiki']
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host: nothing outside the compose network needs it.
    expose:
      - '5432'

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
      - '9000'
    ports:
      # Console only, for local inspection. The API stays internal.
      - '127.0.0.1:9001:9001'

  createbucket:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/workwiki &&
      mc anonymous set none local/workwiki
      "

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://workwiki:workwiki@db:5432/workwiki
      S3_ENDPOINT: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgres://workwiki:workwiki@db:5432/workwiki
      S3_ENDPOINT: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  db-data:
  minio-data:
